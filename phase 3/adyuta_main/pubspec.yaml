name: adyuta_main
description: Adyuta — Voice-first Smart Rural Health & Intelligence Platform
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # ---- Existing Adyuta dependencies ----
  flutter_riverpod: any
  hive_flutter: ^1.1.0
  google_fonts: ^5.0.0
  sensors_plus: any
  shared_preferences: any
  percent_indicator: any
  flutter_tts: any
  supabase_flutter: any
  passkeys: any
  drift: any
  sqlite3_flutter_libs: any
  path_provider: any
  path: any

  # ---- Routing ----
  go_router: any

  # ---- Auth module dependencies (new) ----
  dio: any
  flutter_secure_storage: any
  google_sign_in: any
  local_auth: ^2.1.8
  crypto: any
  pin_code_fields: any
  image_picker: any
  intl: any

  # ---- Feature modules ----
  health_module:
    path: ../health_module
  agri_module:
    path: ../agri_module
  safety_module:
    path: ../safety_module
  education_module:
    path: ../education_module
  governance_module:
    path: ../governance_module

  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: any
  drift_dev: any
  flutter_lints: any

flutter:
  uses-material-design: true
  generate: true   # enables flutter gen-l10n for localizations

  assets:
    - assets/images/
    - assets/offline/health/
    - ../agri_module/assets/Kissan_knowledge_base/
